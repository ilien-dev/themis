<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-label="themis. Two files, one text. The themis rule gate audits a bloated CLAUDE.md and AGENTS.md pair of about 1,065 tokens rule by rule: generic advice and a script the manifest already shows are cut, a shouted rule is rewritten without emphasis, a real gotcha is kept. What stays lands in CLAUDE.md, about 172 tokens, and is copied to an identical AGENTS.md.">
