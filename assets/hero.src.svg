<!--brief
Sentence: anyone who keeps written rules for coding agents gets one short text that Claude Code and every other agent read the same, instead of two files that drift apart and grow.
Flow (hooks/hooks.json, hooks/pre-tool.ts, hooks/parity.ts): Claude edits CLAUDE.md -> PreToolUse checks the cap, the rule gate and the pair -> the edit lands -> PostToolUse copies the file to AGENTS.md -> Claude Code reads CLAUDE.md, other agents read AGENTS.md.
Sample rule: "npm run check first" (npm run check is the repo's own check command, README Development).
Every edit copied: hooks/parity.ts writes the twin after Edit/Write/MultiEdit.
Stays under 2,500 tokens: hooks/pre-tool.ts denies an edit over claude_md_cap (default 2500, .claude-plugin/plugin.json).
Differences never guessed: hooks/pre-tool.ts denies an Edit to a pair that already differs and asks which text is right.
Each new rule checked: hooks/gate/ runs on the new rules of an edit (gate option, default report).
Left out as unfinished: the model-default question of the gate.
No strip: fewer than five facts remain once the key phrase, features and install are struck.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-label="Claude edits CLAUDE.md in a Claude Code session; the PreToolUse hook checks the size cap, the rule gate and that the pair is the same; the new rule lands in CLAUDE.md and the PostToolUse hook copies it to AGENTS.md; Claude Code reads CLAUDE.md and other agents read AGENTS.md.">
