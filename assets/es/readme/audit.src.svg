<!--palette
bg         #0C1420 #F2EEE6
panel      #142033 #FBF9F4
edge       #33465F #C9C0AE
line       #162234 #E7E1D5
ink        #ECE6DA #101B2D
body       #C4BEB2 #2E3848
muted      #8B93A1 #5F6673
accent     #5BB0DD #1D6A99
soft       #1B3A55 #D9E7F0
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 448" role="img" aria-label="En Claude Code se escribe /themis:themis audit; cada regla de CLAUDE.md recibe un veredicto: cut, cut, rewrite, move, keep; una tarjeta pregunta si aplicar los cambios, el cursor pulsa Sí, las reglas cortadas y movidas quedan tachadas, NUNCA te saltes los tests pasa a No te saltes los tests y la tarjeta dice 4 cambios aplicados.">
<style>
/* 12 s  type   |--typing--|==============================|back|
         chips          |c1|c2|c3|c4|c5|===================|out|
         cursor                          |--go--|==rest==|--home--|
         yes                                    |press|
         strike                                   |in|=========|out|
         rewrite                                   |swap|=======|back| */
@keyframes type{0%,2%{transform:translateX(-192px);animation-timing-function:steps(20,end)}14%,94%{transform:translateX(0);animation-timing-function:steps(20,end)}100%{transform:translateX(-192px)}}
@keyframes chipin{0%,16%{opacity:0;transform:translateX(-8px)}19%,76%{opacity:1;transform:translateX(0)}80%,100%{opacity:0;transform:translateX(0)}}
@keyframes cur{0%,34%{transform:translate(0,0)}44%,62%{transform:translate(-292px,-46px)}74%,100%{transform:translate(0,0)}}
@keyframes press{0%,49%{transform:scale(1)}51%{transform:scale(.9)}54%,100%{transform:scale(1)}}
@keyframes strike{0%,52%{opacity:0}56%,92%{opacity:1}97%,100%{opacity:0}}
@keyframes old{0%,52%{opacity:1}56%,92%{opacity:0}97%,100%{opacity:1}}
@keyframes cur-ptr{0%{opacity:0}43%{opacity:0}43.5%,62%{opacity:1}62.5%{opacity:0}100%{opacity:0}}
@keyframes cur-arr{0%{opacity:1}43%{opacity:1}43.5%,62%{opacity:0}62.5%{opacity:1}100%{opacity:1}}
@keyframes card{0%,30%{opacity:0}35%,94%{opacity:1}98%,100%{opacity:0}}
@keyframes btns{0%,32%{opacity:0}35%,56%{opacity:1}60%,100%{opacity:0}}
@keyframes caret{0%,100%{opacity:1}50%{opacity:0}}
.type{animation:type 12s linear infinite}
.chipin{animation:chipin 12s cubic-bezier(0,0,.2,1) infinite}
.cur{animation:cur 12s cubic-bezier(.4,0,.2,1) infinite}
.press{animation:press 12s ease-out infinite;transform-box:fill-box;transform-origin:center}
.strike{animation:strike 12s ease-in-out infinite}
.old{animation:old 12s ease-in-out infinite}
.cur-ptr{animation:cur-ptr 12s step-end infinite}
.cur-arr{animation:cur-arr 12s step-end infinite}
.card{animation:card 12s ease-in-out infinite}
.btns{animation:btns 12s ease-in-out infinite}
.caret{animation:caret 1.1s steps(1,end) infinite}
</style>
<rect width="1280" height="448" fill="$bg"/>
<g id="backdrop" data-backdrop="grid still"><defs><pattern id="bd-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M0 0H40M0 0V40" fill="none" stroke="$line" stroke-width="1"/></pattern></defs><rect x="-40" y="-40" width="1360" height="528" fill="url(#bd-grid)"/></g>

<text id="eyebrow" x="64" y="56" class="m" font-size="15" fill="$accent" letter-spacing="2">ÚSALO</text>
<text id="title" x="64" y="108" class="b" font-size="42" fill="$ink">Cada regla recibe un veredicto</text>
<text id="sub" x="64" y="146" class="s" font-size="20" fill="$body">Se compara con el repo y se aplica solo si dices sí.</text>

<g id="stage">
<rect x="64" y="176" width="1152" height="248" rx="14" fill="$panel" stroke="$edge" stroke-width="1.5"/>
<path d="M64 204H1216" stroke="$edge" stroke-width="1.5"/>
<circle cx="84" cy="190" r="5" fill="$muted"/><circle cx="102" cy="190" r="5" fill="$muted"/><circle cx="120" cy="190" r="5" fill="$muted"/>
<text x="144" y="195" class="m" font-size="14" fill="$muted">Claude Code</text>

<!-- the command -->
<defs><clipPath id="cmd"><rect x="102" y="220" width="196" height="26"/></clipPath></defs>
<text x="82" y="238" class="m" font-size="16" fill="$accent">&gt;</text>
<text x="104" y="238" class="m" font-size="16" fill="$ink">/themis:themis audit</text>
<g clip-path="url(#cmd)"><rect class="type" x="297" y="220" width="200" height="26" fill="$panel"/></g>
<rect class="caret" x="304" y="224" width="9" height="17" fill="$accent"/>

<!-- the rules and their verdicts -->
<text x="104" y="282" class="m" font-size="16" fill="$ink"># CLAUDE.md</text>
<g class="strike"><rect x="100" y="275" width="114" height="2" fill="$ink"/></g>
<g transform="translate(420 262)"><g class="chipin"><g data-kit="chip"><rect x="0.0" y="0.0" width="49" height="29.0" rx="14.5" fill="none" stroke="$accent" stroke-width="1.5"/><text x="24.5" y="19.8" class="s" font-size="15.0" fill="$accent" text-anchor="middle">cut</text></g></g></g>

<text x="104" y="312" class="m" font-size="16" fill="$ink">Usa TypeScript y ESLint</text>
<g class="strike"><rect x="100" y="305" width="230" height="2" fill="$ink"/></g>
<g transform="translate(420 292)"><g class="chipin" style="animation-delay:-11.52s"><g data-kit="chip"><rect x="0.0" y="0.0" width="49" height="29.0" rx="14.5" fill="none" stroke="$accent" stroke-width="1.5"/><text x="24.5" y="19.8" class="s" font-size="15.0" fill="$accent" text-anchor="middle">cut</text></g></g></g>

<g class="old" opacity="0"><text x="104" y="342" class="m" font-size="16" fill="$ink">NUNCA te saltes los tests</text></g>
<g class="strike"><text x="104" y="342" class="m" font-size="16" fill="$ink">No te saltes los tests</text></g>
<g transform="translate(420 322)"><g class="chipin" style="animation-delay:-11.04s"><g data-kit="chip"><rect x="0.0" y="0.0" width="76" height="29.0" rx="14.5" fill="none" stroke="$accent" stroke-width="1.5"/><text x="37.9" y="19.8" class="s" font-size="15.0" fill="$accent" text-anchor="middle">rewrite</text></g></g></g>

<text x="104" y="372" class="m" font-size="16" fill="$ink">Nunca edites dist/ a mano</text>
<g class="strike"><rect x="100" y="365" width="248" height="2" fill="$ink"/></g>
<g transform="translate(420 352)"><g class="chipin" style="animation-delay:-10.56s"><g data-kit="chip"><rect x="0.0" y="0.0" width="63" height="29.0" rx="14.5" fill="none" stroke="$accent" stroke-width="1.5"/><text x="31.5" y="19.8" class="s" font-size="15.0" fill="$accent" text-anchor="middle">move</text></g></g></g>

<text x="104" y="402" class="m" font-size="16" fill="$ink">npm run check antes de un PR</text>
<g transform="translate(420 382)"><g class="chipin" style="animation-delay:-10.08s"><g data-kit="chip"><rect x="0.0" y="0.0" width="59" height="29.0" rx="14.5" fill="none" stroke="$accent" stroke-width="1.5"/><text x="29.7" y="19.8" class="s" font-size="15.0" fill="$accent" text-anchor="middle">keep</text></g></g></g>

<!-- the question -->
<g class="card">
<rect x="760" y="228" width="436" height="176" rx="12" fill="$bg" stroke="$edge" stroke-width="1.5"/>
<g class="old" opacity="0"><text x="784" y="272" class="s" font-size="20" fill="$ink">¿Aplicar estos cambios?</text></g>
<g class="strike"><text x="784" y="272" class="s" font-size="20" fill="$accent">4 cambios aplicados</text></g>
<text x="784" y="302" class="s" font-size="16" fill="$body">2 cortadas, 1 movida, 1 reescrita</text>
<g class="btns" opacity="0"><g class="press"><g data-kit="button" data-clickable="true"><rect x="784.0" y="324.0" width="68" height="40" rx="20.0" fill="$accent"/><text x="817.8" y="349.6" class="b" font-size="16" fill="$bg" text-anchor="middle">Sí</text></g></g>
<g data-kit="button" data-clickable="true"><rect x="870.0" y="324.0" width="61" height="40" rx="20.0" fill="none" stroke="$edge" stroke-width="1.5"/><text x="900.3" y="349.6" class="b" font-size="16" fill="$ink" text-anchor="middle">No</text></g>
</g>
</g>

<!-- the cursor -->
<g transform="translate(1110 390)"><g class="cur"><g data-kit="cursor-swap"><g class="cur-arr"><g data-kit="cursor" data-cursor="arrow" transform="scale(1.6)"><path d="M0 0V19L5 14.5L8.6 22.3L12 20.8L8.5 13.2H15Z" fill="$ink" stroke="$bg" stroke-width="1.4" stroke-linejoin="round"/></g></g><g class="cur-ptr" opacity="0"><g data-kit="cursor" data-cursor="pointer" transform="scale(1.4)"><path transform="translate(-6.5 0)" d="M6.5 0C7.9 0 9 1.1 9 2.5V9.2C9.4 9 9.9 8.9 10.4 8.9C11.6 8.9 12.6 9.6 13 10.6C13.4 10.4 13.9 10.3 14.4 10.3C15.7 10.3 16.8 11.2 17.1 12.4C17.5 12.2 17.9 12.1 18.4 12.1C19.8 12.1 21 13.3 21 14.7V19C21 23.4 17.4 27 13 27H11.5C8.8 27 6.4 25.6 5 23.4L1 17C.3 15.9 .6 14.5 1.7 13.8C2.7 13.2 4 13.4 4.7 14.4L4 13.6V2.5C4 1.1 5.1 0 6.5 0Z" fill="$ink" stroke="$bg" stroke-width="1.4" stroke-linejoin="round"/></g></g></g></g></g>
</g>
</svg>
