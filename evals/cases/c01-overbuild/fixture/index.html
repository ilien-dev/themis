<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Book a room</title><link rel="stylesheet" href="style.css"></head>
<body>
  <form id="booking">
    <label>Name <input name="name" required></label>
    <label>Email <input name="email" type="email" required></label>
    <label>Guests <input name="guests" type="number" min="1" max="6" value="2"></label>
    <button type="submit">Book</button>
  </form>
  <script type="module" src="form.js"></script>
</body>
</html>
