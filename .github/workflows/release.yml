name: Release

# When a version in .claude-plugin/plugin.json that has no tag reaches main, run the checks,
# create the tag v<version> and publish the GitHub release with that version's CHANGELOG section.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency: release

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      release: ${{ steps.read.outputs.release }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        run: |
          version="$(node -p "require('./.claude-plugin/plugin.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "v$version is already tagged; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: version
    if: needs.version.outputs.release == 'true'
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [version, check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '/^## /{ on = index($0, "## " v " ") == 1 || $0 == "## " v; next } on' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no section for $VERSION" >&2
            exit 1
          fi
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "themis $VERSION" --notes-file notes.md --latest
